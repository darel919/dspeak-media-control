name = "dspeak-media-control"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "MEDIA_ROOM_DO"
class_name = "MediaRoomDO"

[[durable_objects.bindings]]
name = "PROVIDER_REGISTRY_DO"
class_name = "ProviderRegistryDO"

[vars]
MEDIA_CONTROL_ISSUER = "dspeak-media-control"
PROVIDER_TICKET_TTL_SECONDS = "120"
MEDIA_CONTROL_DEBUG = "false"
DSPEAK_SFU_ENABLED = "false"
DSPEAK_SFU_SIGNALING_URL = ""
CLOUDFLARE_REALTIME_APP_ID = "59759088ce5e004e5c70411ac799980b"

[exports.MediaRoomDO]
type = "durable-object"
storage = "sqlite"

[exports.ProviderRegistryDO]
type = "durable-object"
storage = "sqlite"

[observability.logs]
enabled = true
invocation_logs = true


# Secrets (set via `wrangler secret put`)
# MEDIA_TICKET_PUBLIC_KEY        Ed25519 public key — verifies media tickets signed by dspeak/Vercel
# PROVIDER_TICKET_PRIVATE_KEY    Ed25519 private key — signs provider tickets for dspeak-sfu
# MEDIA_CONTROL_ADMIN_TOKEN      shared secret for registry/admin calls
# CLOUDFLARE_REALTIME_APP_SECRET Cloudflare Realtime application secret
